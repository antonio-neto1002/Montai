
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Montaí | Pedido confirmado</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
</head>

<body class="pagina-confirmacao">

    <main class="confirmacao-container">

        <section class="confirmacao-card">

            <div class="confirmacao-ilustracao">
                <div class="icone-confirmacao">
                    <i class="fa-solid fa-check"></i>
                </div>

                <i class="fa-solid fa-ice-cream detalhe-sorvete"></i>
            </div>

            <div class="confirmacao-texto">
                <h1>Obrigado pela compra!</h1>

                <p>
                    Seu pedido foi confirmado
                    e já está sendo preparado.
                </p>
            </div>

            <div class="numero-pedido">
                <span>Número do pedido</span>
                <strong id="numero-pedido">#0001</strong>
            </div>

            <a href="home.html" class="botao-principal botao-voltar-inicio">
                <i class="fa-solid fa-house"></i>
                VOLTAR AO INÍCIO
            </a>

        </section>

    </main>
<script src="script.js" defer></script>
</body>
</html>
